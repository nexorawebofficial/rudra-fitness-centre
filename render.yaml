databases:
  - name: rudra-db
    plan: free

services:
  - type: web
    name: rudra-fitness-centre
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: rudra-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.10"
