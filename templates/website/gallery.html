{% extends 'base.html' %}
{% block title %}Gallery - RUDRA Fitness Centre{% endblock %}
{% block content %}
<section class="page-header">
    <h1>Gallery</h1>
</section>
<section class="content-section">
    {% if images %}
    <div class="card-grid">
        {% for image in images %}
        <div class="card">
            <img src="{{ image.image.url }}" alt="{{ image.caption }}" loading="lazy" class="gallery-photo">
            {% if image.caption %}<p class="muted">{{ image.caption }}</p>{% endif %}
        </div>
        {% endfor %}
    </div>
    {% else %}
    <p class="empty-state">Gallery photos coming soon!</p>
    {% endif %}
</section>
{% endblock %}
